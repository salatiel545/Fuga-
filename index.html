<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Fuja do Beijo Fatal 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{width:100%;height:100%}body{position:fixed;top:0;left:0;width:100vw;height:100vh;width:100dvw;height:100dvh;overflow:hidden;background:#000;font-family:'Courier New',monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:1}
#mini{position:fixed;top:46px;right:8px;opacity:.75;border:1px solid #555;border-radius:3px;z-index:5}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;height:40px;background:rgba(0,0,0,.8);border-bottom:2px solid #c8a800;display:none;align-items:center;justify-content:space-around;z-index:10;pointer-events:none}
.hi{display:flex;flex-direction:column;align-items:center}
.hi span{font-size:.45rem;color:#aaa;text-transform:uppercase;letter-spacing:1px}
.hi b{font-size:.9rem;color:#fff}
#tv{color:#ffe066}#sv{color:#ffd700}
#eb{width:70px;height:8px;background:#333;border-radius:4px;overflow:hidden}
#ef{height:100%;background:linear-gradient(90deg,#f60,#fc0)}

/* SCREENS — fixed, full, above everything */
#screens{position:fixed;inset:0;z-index:20}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#ss{background:linear-gradient(160deg,#1a1200,#050300)}
#ds{background:rgba(0,0,0,.95);display:none}
h1{font-size:2rem;color:#ffe066;text-shadow:0 0 20px #f80;margin-bottom:8px}
.sub{color:#c8a800;font-size:.82rem;margin-bottom:14px}
.info{color:#ccc;font-size:.75rem;line-height:1.7;margin-bottom:20px}
.btn{display:inline-block;padding:14px 36px;background:#c8a800;color:#111;border:none;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;box-shadow:0 0 20px rgba(200,168,0,.5)}
.btn:active{opacity:.8}
.surv{font-size:.9rem;color:#aaa;margin-bottom:4px}
.fin{font-size:1.5rem;color:#ffd700;font-weight:700;margin-bottom:20px}

/* Vignette */
#vig{position:fixed;inset:0;pointer-events:none;z-index:8;transition:box-shadow .3s}
#vig.d1{box-shadow:inset 0 0 70px 20px rgba(255,0,0,.35)}
#vig.d2{box-shadow:inset 0 0 110px 50px rgba(255,0,0,.7);animation:pp .4s infinite alternate}
@keyframes pp{from{opacity:.7}to{opacity:1}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;transition:opacity .05s}

/* Mobile controls */
#joy{position:fixed;left:0;bottom:0;width:50%;height:55%;z-index:9;pointer-events:all}
#runbtn{position:fixed;right:20px;bottom:20px;width:66px;height:66px;background:rgba(200,168,0,.75);border:2px solid #c8a800;border-radius:50%;color:#fff;font-size:.68rem;font-weight:700;display:none;align-items:center;justify-content:center;text-align:center;z-index:10;cursor:pointer;-webkit-tap-highlight-color:transparent}
#jbase{position:absolute;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);display:none}
#jknob{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:translate(-50%,-50%);display:none}

#fs_overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999;
}
.btn-fs {
    background: #ffd700; color: #000;
    border: none; padding: 20px 40px;
    font-size: 20px; font-weight: bold;
    border-radius: 50px; cursor: pointer;
    box-shadow: 0 0 20px rgba(255,215,0,0.5);
    margin-top: 20px;
}
</style>
</head>

var kissAudio = null;
var approachAudio = null;

function initAudio(){
  if(kissAudio) return; // já iniciado
  try{
    kissAudio = new Audio("data:audio/ogg;base64," + AUDIO_B64);
    kissAudio.volume = 1.0;
    approachAudio = new Audio("data:audio/ogg;base64," + AUDIO_B64);
    approachAudio.volume = 0.7;
    approachAudio.onended = function(){ approachPlaying = false; };
  }catch(e){}
}

function playKiss(){
  try{ if(kissAudio){ kissAudio.currentTime=0; kissAudio.play(); } }catch(e){}
  sKiss();
}
function playApproach(){
  if(approachPlaying || approachCooldown > 0) return;
  try{ if(approachAudio){ approachAudio.currentTime=0; approachAudio.play(); approachPlaying=true; } }catch(e){}
}
function stopApproach(){
  try{ if(approachAudio){ approachAudio.pause(); approachAudio.currentTime=0; } }catch(e){}
  approachPlaying = false;
}

var AC = null;
function getAC(){
  try{
    if(!AC) AC = new(window.AudioContext||window.webkitAudioContext)();
    if(AC && AC.state==='suspended') AC.resume();
  }catch(e){ AC=null; }
  return AC;
}
function tone(f,t,d,v,dl){
  v=v||0.2; dl=dl||0;
  var a=getAC(), o=a.createOscillator(), g=a.createGain();
  o.connect(g); g.connect(a.destination);
  o.type=t; o.frequency.value=f;
  g.gain.setValueAtTime(v, a.currentTime+dl);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dl+d);
  o.start(a.currentTime+dl); o.stop(a.currentTime+dl+d+0.01);
}
function sStep(run){
  var a=getAC(), o=a.createOscillator(), g=a.createGain();
  o.connect(g); g.connect(a.destination);
  o.type='sine'; o.frequency.setValueAtTime(run?90:70, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(30, a.currentTime+0.09);
  g.gain.setValueAtTime(run?0.28:0.20, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.1);
  o.start(a.currentTime); o.stop(a.currentTime+0.12);
  // echo
  var o2=a.createOscillator(), g2=a.createGain();
  o2.connect(g2); g2.connect(a.destination);
  o2.type='sine'; o2.frequency.value=40;
  g2.gain.setValueAtTime(0.08, a.currentTime+0.1);
  g2.gain.exponentialRampToValueAtTime(0.001, a.currentTime+0.35);
  o2.start(a.currentTime+0.1); o2.stop(a.currentTime+0.37);
}
function sChase(){ tone(165,'sawtooth',0.12,0.15); tone(190,'sawtooth',0.12,0.15,0.13); }
function sNear(){ tone(65,'sine',0.25,0.35); }
function sLaugh(){
  var fs=[175,230,165,210,155];
  for(var i=0;i<fs.length;i++) tone(fs[i],'sawtooth',0.1,0.18,i*0.11);
}
function sHide(){ tone(450,'sine',0.08,0.15); }
function sKiss(){
  var a=getAC();
  tone(180,'sawtooth',0.5,0.4);
  tone(260,'sine',0.15,0.45,0.05);
  tone(130,'sine',0.25,0.3,0.3);
  [0,0.12,0.22,0.33].forEach(function(dl,i){ tone(280+i*70,'sawtooth',0.09,0.15,0.6+dl); });
}

// ── COLLISION ────────────────────────────────────────────────
function solid(wx,wy){ return tileAt(Math.floor(wx/TS),Math.floor(wy/TS))===1; }
function moveEnt(ox,oy,dx,dy,rad){
  rad=rad||0.3;
  var nx=ox+dx,ny=oy+dy,okX=true,okY=true;
  var pts=[[-rad,-rad],[rad,-rad],[-rad,rad],[rad,rad]];
  for(var i=0;i<pts.length;i++){
    if(solid(nx+pts[i][0],oy+pts[i][1])) okX=false;
    if(solid(ox+pts[i][0],ny+pts[i][1])) okY=false;
  }
  return [okX?nx:ox, okY?ny:oy];
}

// ── RAYCASTER (DDA) ──────────────────────────────────────────
var FOV=Math.PI/2.5;
var RAYS=220;
var MAXD=16;
var zBuf=new Float32Array(RAYS);

function castDDA(ox,oy,ang){
  var ca=Math.cos(ang),sa=Math.sin(ang);
  var mc2=Math.floor(ox/TS),mr=Math.floor(oy/TS);
  var stepX=ca>0?1:-1,stepY=sa>0?1:-1;
  var dtX=Math.abs(TS/(ca||1e-9)),dtY=Math.abs(TS/(sa||1e-9));
  var sdX=(ca>0?(mc2+1)*TS-ox:ox-mc2*TS)/Math.abs(ca||1e-9);
  var sdY=(sa>0?(mr+1)*TS-oy:oy-mr*TS)/Math.abs(sa||1e-9);
  var side=0;
  for(var i=0;i<90;i++){
    if(sdX<sdY){sdX+=dtX;mc2+=stepX;side=0;}
    else{sdY+=dtY;mr+=stepY;side=1;}
    if(tileAt(mc2,mr)===1){
      var d=side===0?((mc2-ox/TS+(1-stepX)/2)*TS)/ca:((mr-oy/TS+(1-stepY)/2)*TS)/sa;
      return{d:Math.max(0.05,Math.abs(d)),side:side};
    }
  }
  return{d:MAXD,side:0};
}

// ── RENDER ───────────────────────────────────────────────────
function renderScene(){
  // Ceiling
  ctx.fillStyle='#c8a43a'; ctx.fillRect(0,0,W,H/2);
  // Floor
  ctx.fillStyle='#4a3a0c'; ctx.fillRect(0,H/2,W,H/2);
  // Ceiling lights
  for(var lx=W/12;lx<W;lx+=W/6){
    var lg=ctx.createLinearGradient(lx-W/14,0,lx+W/14,0);
    lg.addColorStop(0,'rgba(255,248,180,0)');
    lg.addColorStop(0.5,'rgba(255,248,180,0.5)');
    lg.addColorStop(1,'rgba(255,248,180,0)');
    ctx.fillStyle=lg; ctx.fillRect(lx-W/14,0,W/7,9);
  }
  var slW=W/RAYS;
  for(var i=0;i<RAYS;i++){
    var ang=pang-FOV/2+(i/RAYS)*FOV;
    var res=castDDA(px,py,ang);
    var corr=res.d*Math.cos(ang-pang);
    zBuf[i]=corr;
    var wH=Math.min(H*3,(TS*H)/(corr+0.001));
    var top=(H-wH)/2;
    var fog=Math.min(1,corr/MAXD);
    var shade=res.side?0.68:1;
    var br=(1-fog*0.82)*shade;
    var R=Math.floor(218*br),G=Math.floor(182*br),B=Math.floor(55*br);
    ctx.fillStyle='rgb('+R+','+G+','+B+')';
    ctx.fillRect(Math.floor(i*slW),Math.floor(top),Math.ceil(slW)+1,Math.ceil(wH));
    // Grid lines
    var li=Math.max(2,Math.floor(wH/7));
    ctx.fillStyle='rgba(70,52,0,'+(0.13*br)+')';
    for(var y=top;y<top+wH;y+=li) ctx.fillRect(Math.floor(i*slW),Math.floor(y),Math.ceil(slW)+1,1);
    if(i%Math.max(1,Math.round(RAYS/22))===0){
      ctx.fillStyle='rgba(70,52,0,'+(0.16*br)+')';
      ctx.fillRect(Math.floor(i*slW),Math.floor(top),1,Math.ceil(wH));
    }
  }
  // Fog
  var fg=ctx.createRadialGradient(W/2,H/2,H*0.05,W/2,H/2,H*0.9);
  fg.addColorStop(0,'rgba(0,0,0,0)'); fg.addColorStop(1,'rgba(8,6,0,0.4)');
  ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
}

function renderEnemy(){
  var dx=ex-px,dy=ey-py,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>MAXD*0.9) return;
  var diff=Math.atan2(dy,dx)-pang;
  while(diff>Math.PI) diff-=Math.PI*2;
  while(diff<-Math.PI) diff+=Math.PI*2;
  if(Math.abs(diff)>FOV*0.73) return;
  var si=Math.floor(((diff/FOV)+0.5)*RAYS);
  if(si>=0&&si<RAYS&&zBuf[si]<dist-0.3) return;
  var screenX=W/2+(diff/FOV)*W;
  var sprH=Math.min(H*2.6,(TS*H)/(dist+0.001));
  var sprW=sprH*0.88;
  var top=(H-sprH)/2;
  var bob=Math.sin(eBobT*9)*5;
  var fog=Math.min(1,dist/MAXD);
  ctx.save();
  ctx.globalAlpha=Math.max(0.08,1-fog*0.62);
  var bw=sprW*0.7,bh=sprH*0.78;
  if(chasing){ctx.shadowColor='#f03';ctx.shadowBlur=sprH*0.08;}
  ctx.fillStyle='#0e0e0e';
  ctx.fillRect(screenX-bw/2,top+bob+sprH*0.13,bw,bh);
  ctx.shadowBlur=0;
  // Legs
  var lw=bw*0.43,lh=sprH*0.2,ls=Math.sin(eBobT*13)*lh*0.4;
  ctx.fillStyle='#1c1c1c';
  ctx.fillRect(screenX-bw*0.38,top+bob+sprH*0.88,lw,lh+ls);
  ctx.fillRect(screenX+bw*0.02,top+bob+sprH*0.88,lw,lh-ls);
  // Arms
  var as=Math.sin(eBobT*9)*0.3;
  ctx.fillStyle='#242424';
  ctx.save();ctx.translate(screenX,top+bob+sprH*0.38);ctx.rotate(as);ctx.fillRect(-bw*0.88,-6,bw*0.46,12);ctx.restore();
  ctx.save();ctx.translate(screenX,top+bob+sprH*0.38);ctx.rotate(-as);ctx.fillRect(bw*0.42,-6,bw*0.46,12);ctx.restore();
  // Face
  var fs=sprW*0.72,fx=screenX-fs/2,fy=top+bob+sprH*0.04;
  ctx.save();
  ctx.beginPath();ctx.rect(fx,fy,fs,fs);ctx.clip();
  if(faceOk){ ctx.drawImage(faceImg,fx,fy,fs,fs); }
  else{ ctx.fillStyle='#e84';ctx.fillRect(fx,fy,fs,fs); }
  if(dangerLvl>=2){ctx.fillStyle='rgba(255,0,40,0.2)';ctx.fillRect(fx,fy,fs,fs);}
  ctx.restore();
  if(dangerLvl===2){
    var ks=Math.max(18,sprW*0.28);
    ctx.font=ks+'px serif';ctx.textAlign='center';
    ctx.fillText('💋',screenX,top+bob-5);
  }
  ctx.restore();
}

function renderMini(){
  var mW=88,mH=88,tw=mW/MCOLS,th=mH/MROWS;
  mctx.fillStyle='rgba(0,0,0,0.85)';mctx.fillRect(0,0,mW,mH);
  for(var r=0;r<MROWS;r++) for(var c=0;c<MCOLS;c++){
    mctx.fillStyle=TMAP[r][c]?'#8a7020':'#2a2006';
    mctx.fillRect(c*tw,r*th,tw-0.4,th-0.4);
  }
  var pc=px/TS,pr=py/TS;
  mctx.fillStyle='#4fc3f7';mctx.beginPath();mctx.arc(pc*tw,pr*th,2.5,0,Math.PI*2);mctx.fill();
  mctx.strokeStyle='#4fc3f7';mctx.lineWidth=1.5;
  mctx.beginPath();mctx.moveTo(pc*tw,pr*th);mctx.lineTo(pc*tw+Math.cos(pang)*5,pr*th+Math.sin(pang)*5);mctx.stroke();
  var ec=ex/TS,er=ey/TS;
  mctx.fillStyle='#f24';mctx.beginPath();mctx.arc(ec*tw,er*th,2.8,0,Math.PI*2);mctx.fill();
}

function renderOverlay(){
  ctx.textAlign='center';
  if(chasing&&dangerLvl<2){
    ctx.fillStyle='rgba(255,60,60,0.8)';ctx.font='bold 13px Courier New';
    ctx.fillText('⚠ ELE TE VIU!',W/2,H-18);
  }
  if(hidden){
    ctx.fillStyle='rgba(0,230,175,0.85)';ctx.font='bold 12px Courier New';
    ctx.fillText('🫥 ESCONDIDO',W/2,H-18);
  }
}

// ── UPDATE ────────────────────────────────────────────────────
function updPlayer(dt){
  run=(keys.ShiftLeft||keys.ShiftRight||mobRun)&&energy>0;
  var maxSpd=run?4.2:2.3,wx=0,wy=0;
  if(keys.ArrowUp||keys.KeyW){ wx+=Math.cos(pang);wy+=Math.sin(pang); }
  if(keys.ArrowDown||keys.KeyS){ wx-=Math.cos(pang)*0.55;wy-=Math.sin(pang)*0.55; }
  if(!mlocked){
    if(keys.ArrowLeft||keys.KeyA) pang-=2.1*dt;
    if(keys.ArrowRight||keys.KeyD) pang+=2.1*dt;
  }
  if(jActive&&(Math.abs(jDX)>0.06||Math.abs(jDY)>0.06)){
    wx+=Math.cos(pang)*(-jDY)+Math.cos(pang+Math.PI/2)*jDX;
    wy+=Math.sin(pang)*(-jDY)+Math.sin(pang+Math.PI/2)*jDX;
  }
  var len=Math.sqrt(wx*wx+wy*wy)||0;
  if(len>0){wx/=len;wy/=len;}
  var acc=len>0?13:9;
  velX+=(wx*maxSpd-velX)*Math.min(1,acc*dt);
  velY+=(wy*maxSpd-velY)*Math.min(1,acc*dt);
  var vl=Math.sqrt(velX*velX+velY*velY);
  if(vl>maxSpd){velX=velX/vl*maxSpd;velY=velY/vl*maxSpd;}
  var res=moveEnt(px,py,velX*dt,velY*dt,0.3);
  px=res[0];py=res[1];
  if(run&&len>0){energy-=27*dt;if(energy<0)energy=0;}
  else{energy+=10*dt;if(energy>maxE)energy=maxE;}
  if(vl>0.3){
    stepT-=dt;
    if(stepT<=0){sStep(run);stepT=run?0.15:0.28;}
  }
  var tc=Math.floor(px/TS),tr=Math.floor(py/TS);
  var wasH=hidden;
  hidden=false;
  for(var i=0;i<HIDES.length;i++){if(HIDES[i][0]===tc&&HIDES[i][1]===tr){hidden=true;break;}}
  if(hidden&&!wasH) sHide();
}

function updEnemy(dt){
  var dx=px-ex,dy=py-ey,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<TS*7){chasing=true;lostT=0;}
  else if(chasing){lostT+=dt;if(lostT>5)chasing=false;}
  dangerLvl=dist<TS*2.2?2:dist<TS*5?1:0;
  var tx=px,ty=py;
  if(!chasing){tx+=(Math.random()-0.5)*TS*5;ty+=(Math.random()-0.5)*TS*5;}
  var tdx=tx-ex,tdy=ty-ey,tl=Math.sqrt(tdx*tdx+tdy*tdy)||1;
  var spd=(chasing?eSpd*1.5:eSpd)*(hidden&&dist<TS*3?0.2:1);
  var er=moveEnt(ex,ey,tdx/tl*spd*dt,tdy/tl*spd*dt,0.35);
  ex=er[0];ey=er[1];
  eBobT+=dt;
  chaseSndT-=dt;
  laughT-=dt;
  approachCooldown-=dt;
  if(dangerLvl===2&&chasing){ playApproach(); }
  else { if(approachPlaying){stopApproach();approachCooldown=2.0;} }
  if(dist<0.72&&!hidden) endGame();
}

function updVig(){
  var v=document.getElementById('vig');
  v.className=hidden?'':(dangerLvl===2?'d2':dangerLvl===1?'d1':'');
}

function updHUD(){
  var mm=Math.floor(elapsed/60),ss=Math.floor(elapsed%60);
  document.getElementById('tv').textContent=mm+':'+(ss<10?'0':'')+ss;
  document.getElementById('sv').textContent=score;
  document.getElementById('ef').style.width=(energy/maxE*100)+'%';
}

// ── LOOP ─────────────────────────────────────────────────────
function loop(now){
  if(!alive) return;
  var dt=Math.min((now-lastT)/1000,0.05);lastT=now;
  elapsed+=dt;score=Math.floor(elapsed*10);
  eSpd=1.9+Math.floor(elapsed/30)*0.28;
  updPlayer(dt);updEnemy(dt);updVig();
  renderScene();renderEnemy();renderOverlay();renderMini();updHUD();
  animID=requestAnimationFrame(loop);
}

// ── GAME FLOW ─────────────────────────────────────────────────
function startGame(){
  resize();
  px=1.5*TS;py=1.5*TS;pang=0;velX=0;velY=0;
  ex=20*TS;ey=18*TS;eBobT=0;
  eSpd=1.9;energy=maxE;elapsed=0;score=0;
  chasing=false;lostT=0;chaseSndT=0;laughT=0;dangerLvl=0;hidden=false;
  stopApproach();approachCooldown=0;
  jActive=false;jDX=0;jDY=0;hideJoy();
  document.getElementById('ss').style.display='none';
  document.getElementById('ds').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('screens').style.display='none';
  if(isMob) runBtn.style.display='flex';
  alive=true;lastT=performance.now();
  cancelAnimationFrame(animID);
  animID=requestAnimationFrame(loop);
}

function restartGame(){
  startGame(); document.getElementById('fs_btn').style.display='block';
}

function endGame(){
  alive=false;cancelAnimationFrame(animID);
  stopApproach();
  playKiss();
  var fl=document.getElementById('flash');
  fl.style.opacity='1';setTimeout(function(){fl.style.opacity='0';},130);
  if(score>best) best=score;
  var mm=Math.floor(elapsed/60),ss=Math.floor(elapsed%60);
  document.getElementById('dt').textContent='Você sobreviveu '+mm+':'+(ss<10?'0':'')+ss;
  document.getElementById('ds2').textContent='Pontos: '+score+(score>=best&&score>0?' 🏆 RECORDE!':'');
  document.getElementById('hud').style.display='none';
  runBtn.style.display='none';hideJoy();
  document.getElementById('screens').style.display='block';
  document.getElementById('ds').style.display='flex';
}

// ── BUTTON WIRING ─────────────────────────────────────────────
function goFullscreen(){
  var el=document.documentElement;
  try{
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if(el.mozRequestFullScreen) el.mozRequestFullScreen();
    // Tenta travar em landscape (horizontal)
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(function(e){});
    }
  }catch(ex){}
  // Resize em loop por 1 segundo pra garantir que pegou o tamanho sem as barras
  var tries = 0;
  var itv = setInterval(function(){
    W=cv.width=window.innerWidth;
    H=cv.height=window.innerHeight;
    document.body.style.width=W+'px';
    document.body.style.height=H+'px';
    resize(); // chama a função interna de redimensionamento do jogo
    if(++tries > 10) clearInterval(itv);
  }, 150);
}
function onStart(e){
  if(e&&e.preventDefault) e.preventDefault();
  if(e&&e.stopPropagation) e.stopPropagation();
  goFullscreen();
  initAudio();
  setTimeout(startGame,150);
  return false;
}
function onRestart(e){
  if(e&&e.preventDefault) e.preventDefault();
  if(e&&e.stopPropagation) e.stopPropagation();
  goFullscreen();
  initAudio();
  setTimeout(restartGame,150);
  return false;
}
