name: Build phase 1 graphics test 2 APK
on:
  push:
    branches: [fase1-graficos-teste-2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/fase1-graficos-teste-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Include exact graphics test game
        run: |
          set -euo pipefail
          echo 'dc0e2d061e0f342260509958792d6476d146628bdf4d98adc4487217bfa7a22f  index.html' | sha256sum -c -
          grep -Fx '    namespace "br.com.biel.fuga"' android/app/build.gradle
          git fetch --depth=1 origin icone-fuga
          git diff --exit-code FETCH_HEAD -- android/app/src/main/res
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify embedded game, signing and app identity
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/index.html | cmp - index.html
          printf 'Embedded game SHA-256: '
          unzip -p "$APK" assets/index.html | sha256sum
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/fuga-badging.txt
          grep -F "package: name='br.com.biel.fuga.graficosteste2'" /tmp/fuga-badging.txt
          grep -F "application-label:'Fuga Teste 2'" /tmp/fuga-badging.txt
          grep -E '^application-icon-[0-9]+:' /tmp/fuga-badging.txt
          if grep -F 'android.permission.INTERNET' /tmp/fuga-badging.txt; then
            echo 'Unexpected INTERNET permission' >&2
            exit 1
          fi
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/fuga-manifest.txt
          grep -F 'br.com.biel.fuga.MainActivity' /tmp/fuga-manifest.txt
          if grep -F 'android.permission.INTERNET' /tmp/fuga-manifest.txt; then
            echo 'Unexpected INTERNET permission' >&2
            exit 1
          fi
          cp "$APK" Fuga-graficos-teste-2.apk
          sha256sum Fuga-graficos-teste-2.apk > Fuga-graficos-teste-2.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Fuga-graficos-teste-2-APK
          path: |
            Fuga-graficos-teste-2.apk
            Fuga-graficos-teste-2.apk.sha256
      - name: Publish separate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create apk-graficos-teste-2 Fuga-graficos-teste-2.apk --target fase1-graficos-teste-2 --title 'Fuga - teste 2 de gráficos da fase 1' --notes 'Teste paralelo dos gráficos da fase 1. A versão aprovada permanece separada.' --prerelease
