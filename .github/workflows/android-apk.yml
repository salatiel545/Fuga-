name: Build phase 1 PSX test APK
on:
  push:
    branches: [fase1-psx-teste]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/fase1-psx-teste'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Include exact graphics test game
        run: |
          set -euo pipefail
          echo '7556d57c66fe6bac84e597792e8e10ef916a592fd959bf2e0285b77e18e28342  index.html' | sha256sum -c -
          grep -Fx '    namespace "br.com.biel.fuga"' android/app/build.gradle
          git fetch --depth=1 origin icone-fuga
          git diff --exit-code FETCH_HEAD -- android/app/src/main/res
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify embedded game, signing and app identity
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/index.html | cmp - index.html
          printf 'Embedded game SHA-256: '
          unzip -p "$APK" assets/index.html | sha256sum
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/fuga-badging.txt
          grep -F "package: name='br.com.biel.fuga.psxteste'" /tmp/fuga-badging.txt
          grep -F "application-label:'Fuga PSX Teste'" /tmp/fuga-badging.txt
          grep -E '^application-icon-[0-9]+:' /tmp/fuga-badging.txt
          if grep -F 'android.permission.INTERNET' /tmp/fuga-badging.txt; then
            echo 'Unexpected INTERNET permission' >&2
            exit 1
          fi
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/fuga-manifest.txt
          grep -F 'br.com.biel.fuga.MainActivity' /tmp/fuga-manifest.txt
          if grep -F 'android.permission.INTERNET' /tmp/fuga-manifest.txt; then
            echo 'Unexpected INTERNET permission' >&2
            exit 1
          fi
          cp "$APK" Fuga-PSX-teste.apk
          sha256sum Fuga-PSX-teste.apk > Fuga-PSX-teste.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Fuga-PSX-teste-APK
          path: |
            Fuga-PSX-teste.apk
            Fuga-PSX-teste.apk.sha256
      - name: Publish separate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create apk-psx-teste Fuga-PSX-teste.apk --target fase1-psx-teste --title 'Fuga - teste PSX da fase 1' --notes 'Teste visual PSX paralelo da fase 1, com recursos próprios. A versão anterior permanece separada.' --prerelease
